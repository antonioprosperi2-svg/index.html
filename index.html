<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAYCOMBO - BeeEngine</title>
  <style>
    /* Sfondo sfumato stabile */
    body {
      background: linear-gradient(135deg, #1d1b3a, #00bfa5);
      background-attachment: fixed;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px 10px;
    }

    /* Scheda centrale pulita */
    .box-principale {
      max-width: 650px;
      margin: 40px auto;
      background: rgba(0, 0, 0, 0.4);
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* Logo gigante e proporzionato */
    .box-principale img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    /* Titolo e Testi ben visibili */
    h1 {
      font-size: 26px;
      margin: 15px 0 10px 0;
    }

    p {
      font-size: 16px;
      line-height: 1.5;
      color: #e0e0e0;
    }

    /* Pulsanti ben separati */
    .menu-link {
      margin: 25px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: block;
      background: #00e676;
      color: #000000;
      text-decoration: none;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
    }

    .btn-alt {
      background: transparent;
      color: #00e676;
      border: 2px solid #00e676;
    }
  </style>
</head>
<body>

  <div class="box-principale">
    <img src="https://github.com/user-attachments/assets/ec1709c8-401d-4c41-a44c-cf58bcbfeef3" alt="BeeEngine Logo">

    <h1>BeeEngine 2D Game Engine</h1>
    <p>Sviluppo strutture HTML per piattaforme giochi personalizzate in Vanilla JS pura ES6.</p>

    <div class="menu-link">
      <a class="btn" href="https://antonioprosperi2-svg.github.io/Monster-Munch-Premium-Arcade-BeeEngine-/">🎮 Gioca a Monster Munch</a>
      <a class="btn btn-alt" href="https://www.playcombo.it">🌐 Vai alla lista giochi</a>
    </div>
  </div>

</body>
</html>
